# Bonin Skills 自动化同步配置
# Auto-Sync Configuration for bonin-skills
#
# 此文件由自动化同步程序读取，定义源仓库、目标仓库、同步规则和审计标准。
# This file is read by the auto-sync program; defines source/target repos, sync rules, and audit standards.

# ============================================================
# 源仓库配置 / Source Repositories
# ============================================================
sources:
  - name: baoyu
    path: "d:\\Repo\\baoyu-skills"
    # 上次同步的基准 commit（程序会自动更新此字段）
    # Baseline commit for last sync (auto-updated by the program)
    baseline_commit: "505a7e1"
    # 路径映射：baoyu -> bonin（大小写敏感）
    path_replace:
      - { from: "baoyu", to: "bonin", case_sensitive: true }
    # 内容替换规则（顺序执行）
    content_replacements:
      - { pattern: "github\\.com/JimLiu/baoyu-skills", replace: "github.com/BoninEDU/bonin-skills" }
      - { pattern: "JimLiu/baoyu-skills", replace: "BoninEDU/bonin-skills" }
      - { pattern: "JimLiu", replace: "BoninEDU" }
      - { pattern: "BAOYU", replace: "BONIN", case_sensitive: true }
      - { pattern: "Baoyu", replace: "Bonin", case_sensitive: true }
      - { pattern: "baoyu", replace: "bonin", case_sensitive: true }
    # 贡献者信息脱敏规则（正则）
    contributor_patterns:
      - { pattern: " \\(by @[^)]+\\)", replace: "" }
      - { pattern: " contributed by @\\S+", replace: "" }
      - { pattern: " <[^>]+@[^>]+>", replace: "" }
      - { pattern: "Credit to [^\\n]+", replace: "" }

  - name: ljg
    path: "d:\\Repo\\ljg-skills"
    baseline_commit: "0b77aa2"
    path_replace:
      - { from: "ljg", to: "bonin", case_sensitive: true }
    content_replacements:
      - { pattern: "github\\.com/lijigang/ljg-skills", replace: "github.com/BoninEDU/bonin-skills" }
      - { pattern: "lijigang/ljg-skills", replace: "BoninEDU/bonin-skills" }
      - { pattern: "github\\.com/lijigang", replace: "github.com/BoninEDU" }
      - { pattern: "lijigang", replace: "BoninEDU" }
      - { pattern: "LJG", replace: "BONIN", case_sensitive: true }
      - { pattern: "Ljg", replace: "Bonin", case_sensitive: true }
      - { pattern: "ljg", replace: "bonin", case_sensitive: true }
      # SSH URL 特殊处理（@ 字符用 \x40 转义）
      - { pattern: "git\\x40github\\.com:lijigang/ljg-skills\\.git", replace: "git@github.com:BoninEDU/bonin-skills.git" }

  # ============================================================
  # Added 2026-11: migrated sources (additive, backward compatible)
  # ============================================================

  - name: book-to-skill
    # Migrated 2026-11-01 as skills/bonin-book-to-skill/ (full-stack)
    path: "d:\\Repo\\book-to-skill"
    # Initial baseline = upstream HEAD at migration time (2026-11-01).
    # Live baseline is tracked in baselines.json (auto-advanced after commit).
    baseline_commit: "7540eefbe74933f5fc84c86becac52486b347778"
    # dest_prefix: upstream repo root maps under this prefix in bonin-skills
    dest_prefix: "skills/bonin-book-to-skill"
    # Inner package dir rename: book_to_skill/ -> bonin_book_to_skill/
    path_replace:
      - { from: "^book_to_skill/", to: "bonin_book_to_skill/", regex: true }
    content_replacements:
      # R1-R3: upstream GitHub URLs (longest first)
      - { pattern: "github\\.com/virgiliojr94/book-to-skill", replace: "github.com/BoninEDU/bonin-skills" }
      - { pattern: "virgiliojr94/book-to-skill", replace: "BoninEDU/bonin-skills" }
      - { pattern: "github\\.com/virgiliojr94", replace: "github.com/BoninEDU" }
      # R4: upstream author account
      - { pattern: "virgiliojr94", replace: "BoninEDU" }
      # R7: brand/title forms (case-sensitive, run BEFORE generic hyphen form).
      # Lookbehind keeps re-runs idempotent (already-migrated text unchanged).
      - { pattern: "(?<!Bonin )Book-to-Skill", replace: "Bonin Book-to-Skill", case_sensitive: true }
      - { pattern: "(?<!BONIN-)BOOK-TO-SKILL", replace: "BONIN-BOOK-TO-SKILL", case_sensitive: true }
      - { pattern: "Booklin", replace: "Bonin", case_sensitive: true }
      - { pattern: "booklin", replace: "bonin", case_sensitive: true }
      # R5: python package name (underscore form, lookbehind = idempotent)
      - { pattern: "(?<!bonin_)book_to_skill", replace: "bonin_book_to_skill", case_sensitive: true }
      # R6: CLI / skill name (hyphen form, lookbehind = idempotent)
      - { pattern: "(?<!bonin-)book-to-skill", replace: "bonin-book-to-skill", case_sensitive: true }
    # R8: email leftovers
    contributor_patterns:
      - { pattern: " <[^>]+@[^>]+>", replace: "" }
    # Source-specific skip patterns = files excluded at migration time
    skip_patterns:
      - "^\\.github/"
      - "^BACKERS\\.md$"
      - "^CONTRIBUTING\\.md$"
      - "^LICENSE\\.md$"
      - "^SECURITY\\.md$"
      - "^SECURITY-NOTICE\\.md$"
      - "^README\\.md$"
      - "^README\\.ru\\.md$"
      - "^README\\.zh-CN\\.md$"
      - "^CLAUDE\\.md$"
      - "^mkdocs\\.yml$"
      - "^cliff\\.toml$"
      - "^overrides/"
      - "^docs/index\\.md$"
      - "^docs/404\\.md$"
      - "^docs/CNAME$"
      - "^docs/robots\\.txt$"
      - "^docs/assets/"

  - name: handraw-style
    # Migrated 2026-11-01 as skills/bonin-handraw-style/ (full-stack)
    path: "d:\\Repo\\handraw-style"
    baseline_commit: "572dff8f8cc1dc16ff9bef1422e90b3dfc42284d"
    dest_prefix: "skills/bonin-handraw-style"
    # NOTE: the inner sub-skill dir skills/handdraw-style-prompter/ KEEPS its
    # name on purpose (install layout dependency) - do not add a generic
    # handraw-style -> bonin-handraw-style replacement (the string
    # "handraw-style" is a substring of the migrated brand name itself).
    path_replace: []
    content_replacements:
      # H1/H2: upstream domains -> Bonin site (longest first)
      - { pattern: "static\\.handraw-style\\.com", replace: "www.boninaigc.top" }
      - { pattern: "img\\.handraw-style\\.com", replace: "www.boninaigc.top" }
      - { pattern: "handraw-style\\.com", replace: "www.boninaigc.top" }
      # H3: upstream GitHub URL
      - { pattern: "github\\.com/yang0/handraw-style", replace: "github.com/BoninEDU/bonin-skills" }
      # H7: gitee mirror (MUST run before H4, else the bare author-id rule
      # rewrites the URL before these specific patterns can match)
      - { pattern: "git@gitee\\.com:yang02010/handraw-style\\.git", replace: "git@github.com:BoninEDU/bonin-skills\\.git" }
      - { pattern: "gitee\\.com:yang02010/handraw-style", replace: "github.com/BoninEDU/bonin-skills" }
      - { pattern: "gitee\\.com/yang02010/handraw-style", replace: "github.com/BoninEDU/bonin-skills" }
      # H4: upstream author identifiers (longest first)
      - { pattern: "yang02010", replace: "Bonin" }
      - { pattern: "yang0/handraw-style", replace: "BoninEDU/bonin-skills" }
      - { pattern: "\\byang0\\b", replace: "Bonin" }
      # H5: upstream studio brand
      - { pattern: "HandRaw Style Studio", replace: "Bonin AIGC" }
      # H6: third-party marketplace endpoint
      - { pattern: "open\\.workbuddy\\.cn", replace: "www.boninaigc.top" }
      # SKILL.md frontmatter name line ONLY (inner sub-skill paths unchanged)
      - { pattern: "(?m)^name:\\s*handdraw-style-prompter\\s*$", replace: "name: bonin-handraw-style" }
    skip_patterns:
      - "^\\.github/"
      - "^README\\.md$"
      - "^README_en\\.md$"
      - "^RELEASE_AUDIT\\.md$"
      - "^build_workbuddy_release\\.py$"
      - "^scripts/workbuddy_check_audit\\.py$"
      - "^scripts/workbuddy_midnight_resubmit\\.py$"
      - "^scripts/sync_to_static\\.py$"
      - "^scripts/discourse_client\\.py$"
      - "^scripts/audit_release\\.py$"
      - "^scripts/package_skill\\.py$"

# ============================================================
# 目标仓库配置 / Target Repository
# ============================================================
target:
  path: "d:\\Repo\\bonin-skills"
  remote: "origin"
  branch: "master"
  github_owner: "BoninEDU"
  github_repo: "bonin-skills"

# ============================================================
# 同步规则 / Sync Rules
# ============================================================
sync:
  # 跳过的文件模式（正则）
  skip_patterns:
    - "^LICENSE$"
    - "^\\.gitignore$"
    - "^package-lock\\.json$"
    - "^bun\\.lockb$"
    - "^\\.releaserc\\.yml$"
  # 二进制文件扩展名（直接复制，不做内容转换）
  binary_extensions:
    - ".png"
    - ".webp"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".ico"
    - ".svg"
    - ".lock"
    - ".lockb"
    - ".pdf"
    - ".zip"
    - ".woff"
    - ".woff2"
    - ".ttf"
    - ".eot"
  # 是否在同步后自动提交
  auto_commit: true
  # 是否在同步后自动推送
  auto_push: true
  # 提交信息前缀
  commit_prefix: "feat: auto-sync from upstream"

# ============================================================
# 审计规则 / Audit Rules
# ============================================================
audit:
  # 检查所有 SKILL.md 的 YAML front matter
  check_skill_md: true
  # 检查残留的作者信息
  check_author_info: true
  # 禁止出现的关键词
  forbidden_keywords:
    - "JimLiu"
    - "lijigang"
    - "baoyu-skills"
    - "ljg-skills"
    # Added 2026-11 (verified zero-match repo-wide at migration time)
    - "virgiliojr94"
    - "booklin"
    - "yang02010"
    - "handraw-style.com"
    - "HandRaw Style Studio"
    - "open.workbuddy.cn"
  # 检查 package.json 名称一致性
  check_package_names: true
  # 检查 bun.lock 文件
  check_lock_files: true

# ============================================================
# 调度配置 / Schedule
# ============================================================
schedule:
  # 每周执行一次（Windows 任务计划程序触发）
  # 每周一早上 6:00 执行
  weekly: true
  # 日志文件路径
  log_file: "d:\\Repo\\bonin-skills\\.auto-sync\\sync.log"
  # 日志保留天数
  log_retention_days: 30
  # 失败重试次数
  retry_count: 3
  # 重试间隔（秒）
  retry_interval_seconds: 60
